<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash wa Azida</title></head>
<body>
<h3>Ash wa Azida</h3>
<p id="status">Load GGUF file below</p>
<input type="file" id="fileInput" accept=".gguf">
<hr>
<div id="chat"></div>
<hr>
<input id="prompt" style="width:65%;padding:12px;font-size:16px" placeholder="Type here..." type="text" inputmode="text">
<button id="sendBtn" style="padding:12px">SEND</button>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.4/+esm';
const CONFIG = {
  'single-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.4/esm/single-thread/wllama.wasm',
  'multi-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.4/esm/multi-thread/wllama.wasm',
};
let wllama=null, chatHistory="";
const status=document.getElementById('status'), chat=document.getElementById('chat'), fileInput=document.getElementById('fileInput'), prompt=document.getElementById('prompt'), sendBtn=document.getElementById('sendBtn');
fileInput.onchange=async()=>{
  status.textContent="Loading... wait 30s";
  wllama=new Wllama(CONFIG);
  await wllama.loadModel([fileInput.files[0]],{n_threads:2});
  status.textContent="READY! Now type below";
};
async function sendMessage(){
  const text=prompt.value.trim();
  if(!text){ return; }
  if(!wllama){ alert("Load GGUF file first!"); return; }
  prompt.value="";
  const u=document.createElement('div'); u.textContent="You: "+text; chat.appendChild(u);
  const a=document.createElement('div'); a.textContent="Ash: ..."; chat.appendChild(a);
  const formatted=`<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
  let response="";
  await wllama.createCompletion(chatHistory+formatted,{
    nPredict:400,
    onNewToken:(t,p,c)=>{ response=c; a.textContent="Ash: "+response; }
  });
  chatHistory+=formatted+response+"<|im_end|>\n";
}
sendBtn.onclick=sendMessage;
prompt.onkeydown=e=>{ if(e.key==="Enter") sendMessage(); };
</script>
</body>
</html>
